<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbe7a1" />
      <stop offset="35%" stop-color="#e7b84e" />
      <stop offset="70%" stop-color="#c8901f" />
      <stop offset="100%" stop-color="#b07a16" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3c8" />
      <stop offset="50%" stop-color="#f0c95e" />
      <stop offset="100%" stop-color="#d8a02c" />
    </linearGradient>
  </defs>

  <!-- Right ring (behind) -->
  <circle cx="40" cy="29" r="15" fill="none" stroke="url(#goldShine)" stroke-width="5" />
  <circle cx="40" cy="29" r="15" fill="none" stroke="#9c6a12" stroke-width="0.8" opacity="0.5" />

  <!-- Left ring (in front) -->
  <circle cx="25" cy="37" r="15" fill="none" stroke="url(#gold)" stroke-width="5" />
  <circle cx="25" cy="37" r="15" fill="none" stroke="#9c6a12" stroke-width="0.8" opacity="0.5" />

  <!-- Weave: small arc of the right ring drawn over the left ring -->
  <path d="M 31.5 41.6 A 15 15 0 0 0 25.6 32.2" fill="none" stroke="url(#goldShine)" stroke-width="5" stroke-linecap="round" />

  <!-- Tiny sparkle gem on the left ring -->
  <path d="M25 19.5 l1.6 2.4 2.4 1.6 -2.4 1.6 -1.6 2.4 -1.6 -2.4 -2.4 -1.6 2.4 -1.6 Z" fill="#fff6da" />
</svg>
