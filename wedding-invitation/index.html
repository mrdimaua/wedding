<!DOCTYPE html>
<html lang="uk" style="color-scheme: only light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#faf8f4" />
    <meta name="supported-color-schemes" content="light" />
    <style>
      :root,
      html {
        color-scheme: only light !important;
        background-color: #faf8f4 !important;
      }
      body {
        background-color: #faf8f4 !important;
        color: #3d3429 !important;
      }
    </style>
    <title data-i18n="meta.title">Запрошення</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  </head>
  <body>
    <p id="boot-hint" class="boot-hint" hidden>
      Відкрийте сайт через локальний сервер (не подвійним кліком по файлу). У терміналі:
      <code>node serve.js</code>
      потім <a href="http://localhost:8080">http://localhost:8080</a>
    </p>

    <nav class="lang-switcher" aria-label="Language">
      <button type="button" data-lang="ua" class="lang-btn active">UA</button>
      <button type="button" data-lang="en" class="lang-btn">EN</button>
      <button type="button" data-lang="ro" class="lang-btn">RO</button>
    </nav>

    <!-- Screen 1: Envelope -->
    <section id="screen-envelope" class="screen screen-envelope" aria-label="Welcome">
      <p class="envelope-hint-top" data-i18n="screen1.invitation_arrived">Вам надійшло запрошення</p>

      <button
        type="button"
        class="envelope-wrap"
        id="envelope-btn"
        aria-label="Open invitation"
      >
        <div class="envelope" id="envelope">
          <div class="envelope-card" id="envelope-card">
            <div class="envelope-card__front" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1105 847" fill="none" aria-hidden="true">
                <defs>
                  <filter id="mono-emboss" x="-60%" y="-60%" width="220%" height="220%">
                    <feDropShadow dx="0" dy="1.6" stdDeviation="0.35" flood-color="#3A0810" flood-opacity="0.72" result="shadow"/>
                    <feDropShadow dx="0" dy="-0.6" stdDeviation="0.25" flood-color="#FFFFFF" flood-opacity="0.38" result="highlight"/>
                    <feMerge>
                      <feMergeNode in="shadow"/>
                      <feMergeNode in="highlight"/>
                      <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                  </filter>
                </defs>
                <image xlink:href="images/envelope/envelope.png" x="0" y="0" width="1105" height="847" preserveAspectRatio="none"/>
                <text class="env-monogram" x="570.5" y="555" text-anchor="middle" dominant-baseline="middle" filter="url(#mono-emboss)">D♥E</text>
              </svg>
            </div>
            <div class="envelope-card__back">
              <div class="envelope-card__backing" aria-hidden="true"></div>
              <div class="envelope-letter" id="envelope-letter">
                <div class="letter-paper"></div>
              </div>
            </div>
          </div>
        </div>
      </button>

      <p class="envelope-hint-bottom" data-i18n="screen1.tap_envelope">Натисніть на конверт</p>
    </section>

    <!-- Screen 2: Main invitation -->
    <main id="screen-main" class="screen screen-main hidden" aria-hidden="true">
      <header class="hero">
        <!-- Garland SVG definitions (hidden template) -->
        <svg
          class="garland-defs"
          width="0"
          height="0"
          aria-hidden="true"
          style="position: absolute; width: 0; height: 0; pointer-events: none"
        >
          <defs>
            <!-- ===== ВАРІАНТ 1 (неактивний): теплі лампочки =====
            <radialGradient id="bulb-halo-grad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.85" />
              <stop offset="42%" stop-color="#ffb84d" stop-opacity="0.38" />
              <stop offset="100%" stop-color="#ffb84d" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="bulb-glass-grad" cx="42%" cy="30%" r="62%">
              <stop offset="0%" stop-color="#fffef8" />
              <stop offset="55%" stop-color="#fff0c8" />
              <stop offset="100%" stop-color="#ffce78" />
            </radialGradient>
            <g id="bulb-template">
              <circle class="bulb-halo" cx="0" cy="40" r="30" fill="url(#bulb-halo-grad)" />
              <line x1="0" y1="0" x2="0" y2="15" stroke="#2c241b" stroke-width="1.5" />
              <rect x="-6" y="15" width="12" height="10" rx="2" fill="#2c241b" />
              <rect x="-4" y="13" width="8" height="2" fill="#2c241b" />
              <path d="M -5,25 L 5,25 L 8,35 A 15,15 0 1,1 -8,35 Z" fill="url(#bulb-glass-grad)" class="bulb-glass" />
              <path
                d="M -2,25 L -2,37 L -4,41 M 2,25 L 2,37 L 4,41 M -4,41 L 4,41"
                fill="none"
                stroke="#ffb84d"
                stroke-width="1.5"
                opacity="0.8"
              />
            </g>
            ===== кінець варіанту з лампочками ===== -->

            <!-- ===== ВАРІАНТ 2 (активний): матові фетрові сердечка, нитка проходить крізь них ===== -->
            <linearGradient id="bulb-glass-grad" x1="0.18" y1="0" x2="0.72" y2="1">
              <stop offset="0%" stop-color="#c12e38" />
              <stop offset="55%" stop-color="#a21f29" />
              <stop offset="100%" stop-color="#82161f" />
            </linearGradient>
            <radialGradient id="heart-shade" cx="40%" cy="32%" r="75%">
              <stop offset="0%" stop-color="#ff7a82" stop-opacity="0.28" />
              <stop offset="58%" stop-color="#000000" stop-opacity="0" />
              <stop offset="100%" stop-color="#590d14" stop-opacity="0.5" />
            </radialGradient>
            <g id="bulb-template">
              <path
                transform="translate(2.5,4)"
                fill="#360a0e"
                opacity="0.16"
                d="M0,-7 C -5,-18 -17,-22 -25,-15 C -33,-8 -30,4 -22,12 C -15,18 -6,22 0,27 C 6,22 15,18 22,12 C 30,4 33,-8 25,-15 C 17,-22 5,-18 0,-7 Z"
              />
              <path
                class="heart-fill"
                fill="url(#bulb-glass-grad)"
                d="M0,-7 C -5,-18 -17,-22 -25,-15 C -33,-8 -30,4 -22,12 C -15,18 -6,22 0,27 C 6,22 15,18 22,12 C 30,4 33,-8 25,-15 C 17,-22 5,-18 0,-7 Z"
              />
              <path
                class="heart-shade"
                fill="url(#heart-shade)"
                d="M0,-7 C -5,-18 -17,-22 -25,-15 C -33,-8 -30,4 -22,12 C -15,18 -6,22 0,27 C 6,22 15,18 22,12 C 30,4 33,-8 25,-15 C 17,-22 5,-18 0,-7 Z"
              />
            </g>
          </defs>
        </svg>

        <!-- Garland Overlay -->
        <div id="garland-overlay" aria-hidden="true">
          <div class="garland-layer layer-back">
            <svg class="garland-svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMin slice" xmlns="http://www.w3.org/2000/svg">
              <g class="wire-group">
                <path class="wire wire-back" d="M -50 20 C 300 250, 900 150, 1250 80" fill="none" stroke="#a32a32" stroke-width="2" />
                <g transform="translate(62, 79.5)"><g class="bulb-item" data-delay="0.1"><use href="#bulb-template" /></g></g>
                <g transform="translate(251.6, 136.2)"><g class="bulb-item" data-delay="0.5"><use href="#bulb-template" /></g></g>
                <g transform="translate(458, 160.6)"><g class="bulb-item" data-delay="1.2"><use href="#bulb-template" /></g></g>
                <g transform="translate(671.2, 159.9)"><g class="bulb-item" data-delay="0.8"><use href="#bulb-template" /></g></g>
                <g transform="translate(881, 141.4)"><g class="bulb-item" data-delay="2.1"><use href="#bulb-template" /></g></g>
                <g transform="translate(1077.3, 112.3)"><g class="bulb-item" data-delay="1.5"><use href="#bulb-template" /></g></g>
              </g>
            </svg>
          </div>

          <div class="garland-layer layer-front">
            <svg class="garland-svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMin slice" xmlns="http://www.w3.org/2000/svg">
              <g class="wire-group">
                <path class="wire wire-front" d="M -50 -20 C 400 370, 800 270, 1250 -50" fill="none" stroke="#c0303a" stroke-width="3" />
                <g transform="translate(83.6, 83)"><g class="bulb-item" data-delay="0.4"><use href="#bulb-template" /></g></g>
                <g transform="translate(214.8, 157)"><g class="bulb-item" data-delay="1.1"><use href="#bulb-template" /></g></g>
                <g transform="translate(344.2, 206)"><g class="bulb-item" data-delay="2.7"><use href="#bulb-template" /></g></g>
                <g transform="translate(472.4, 230)"><g class="bulb-item" data-delay="0.2"><use href="#bulb-template" /></g></g>
                <g transform="translate(600, 231)"><g class="bulb-item" data-delay="1.8"><use href="#bulb-template" /></g></g>
                <g transform="translate(727.6, 211)"><g class="bulb-item" data-delay="0.7"><use href="#bulb-template" /></g></g>
                <g transform="translate(855.8, 171)"><g class="bulb-item" data-delay="2.2"><use href="#bulb-template" /></g></g>
                <g transform="translate(985.2, 113)"><g class="bulb-item" data-delay="1.3"><use href="#bulb-template" /></g></g>
                <g transform="translate(1116.4, 39)"><g class="bulb-item" data-delay="0.8"><use href="#bulb-template" /></g></g>
              </g>
            </svg>
          </div>
        </div>

        <h1 class="couple-names">
          <img class="wing wing--left" src="images/wing-left.png" alt="" aria-hidden="true" width="68" height="68" />

          <span class="names-text">
            <span data-i18n="screen2.groom_name"></span>
            <span class="rings" aria-hidden="true">
              <svg viewBox="0 0 72 48" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="ring-gold" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f7dd92" />
                    <stop offset="48%" stop-color="#d9a93a" />
                    <stop offset="100%" stop-color="#a9760a" />
                  </linearGradient>
                </defs>
                <circle cx="27" cy="27" r="15" fill="none" stroke="url(#ring-gold)" stroke-width="4.5" />
                <circle cx="46" cy="27" r="15" fill="none" stroke="url(#ring-gold)" stroke-width="4.5" />
                <path d="M46 2 l2.6 4 -2.6 4 -2.6-4 z" fill="#fff7df" stroke="#e6c46a" stroke-width="0.8" />
              </svg>
            </span>
            <span data-i18n="screen2.bride_name"></span>
          </span>

          <img class="wing wing--right" src="images/wing-right.png" alt="" aria-hidden="true" width="68" height="68" />
        </h1>

        <div class="photo-deck-wrap">
          <div class="photo-deck-loader" id="photo-deck-loader" hidden>
            <span class="loader-spinner" aria-hidden="true"></span>
          </div>
          <div
            class="photo-deck"
            id="photo-deck"
            role="button"
            tabindex="0"
            aria-label="Photos"
            hidden
          ></div>
          <p class="photo-deck-hint" id="photo-deck-hint" data-i18n="screen2.photos_hint" hidden></p>
        </div>

        <p class="wedding-date" data-i18n="screen2.wedding_date"></p>
      </header>

      <section class="paper-widget" aria-labelledby="invitation-title">
        <div class="paper-sheet">
          <h2 id="invitation-title" class="paper-title" data-i18n="invitation.title"></h2>
          <p class="paper-body" data-i18n="invitation.body"></p>
        </div>
      </section>

      <section class="program-section" aria-labelledby="program-title">
        <h2 id="program-title" class="section-title" data-i18n="program.title"></h2>

        <div class="program-timeline" id="program-timeline">
          <svg class="program-path-svg" id="program-path-svg" aria-hidden="true">
            <path id="program-path" fill="none" />
          </svg>
          <div class="program-heart" id="program-heart" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28">
              <path
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                fill="currentColor"
              />
            </svg>
          </div>
          <ol class="program-list" id="program-list"></ol>
        </div>
      </section>

      <section class="countdown-section" aria-labelledby="countdown-title">
        <h2 id="countdown-title" class="section-title" data-i18n="countdown.title"></h2>
        <div class="countdown" id="countdown">
          <div class="countdown-unit">
            <span class="countdown-value" id="cd-days">0</span>
            <span class="countdown-label" data-i18n="countdown.days"></span>
          </div>
          <div class="countdown-unit">
            <span class="countdown-value" id="cd-hours">0</span>
            <span class="countdown-label" data-i18n="countdown.hours"></span>
          </div>
          <div class="countdown-unit">
            <span class="countdown-value" id="cd-minutes">0</span>
            <span class="countdown-label" data-i18n="countdown.minutes"></span>
          </div>
          <div class="countdown-unit">
            <span class="countdown-value" id="cd-seconds">0</span>
            <span class="countdown-label" data-i18n="countdown.seconds"></span>
          </div>
        </div>
      </section>

      <section class="palette-section" aria-labelledby="palette-title">
        <h2 id="palette-title" class="section-title" data-i18n="palette.title"></h2>
        <p class="palette-description" data-i18n="palette.description"></p>
        <ul class="palette-swatches" id="palette-swatches"></ul>
      </section>

      <section class="restaurant-section" aria-labelledby="restaurant-title">
        <h2 id="restaurant-title" class="section-title" data-i18n="restaurant.title"></h2>

        <div class="restaurant-info">
          <div class="copy-row">
            <span class="restaurant-name" id="restaurant-name" data-i18n="restaurant.name"></span>
            <button
              type="button"
              class="copy-btn"
              data-copy-target="restaurant-name"
              data-i18n-aria="restaurant.copy"
            >
              <span class="ic ic-copy" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" />
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                </svg>
              </span>
              <span class="ic ic-check" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12" />
                </svg>
              </span>
            </button>
          </div>

          <div class="copy-row">
            <span class="restaurant-coords" id="restaurant-coords" data-i18n="restaurant.coordinates"></span>
            <button
              type="button"
              class="copy-btn"
              data-copy-target="restaurant-coords"
              data-i18n-aria="restaurant.copy"
            >
              <span class="ic ic-copy" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" />
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                </svg>
              </span>
              <span class="ic ic-check" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12" />
                </svg>
              </span>
            </button>
          </div>
        </div>

        <div class="restaurant-loader" id="restaurant-loader" hidden>
          <span class="loader-spinner" aria-hidden="true"></span>
        </div>

        <div class="restaurant-carousel" id="restaurant-carousel" hidden>
          <button type="button" class="carousel-nav carousel-prev" aria-label="Prev">&#8249;</button>
          <div class="carousel-viewport">
            <div class="carousel-track" id="carousel-track"></div>
          </div>
          <button type="button" class="carousel-nav carousel-next" aria-label="Next">&#8250;</button>
          <div class="carousel-dots" id="carousel-dots"></div>
        </div>
      </section>

      <section class="location-section" aria-labelledby="location-title">
        <h2 id="location-title" class="section-title" data-i18n="location.title"></h2>
        <div class="map-wrap">
          <iframe
            id="google-map"
            title="Google Maps"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d5587.967737788135!2d23.59064132495777!3d47.64158133523316!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4737dbf4795a4591%3A0x76fc737364471d63!2sCastel%20Transilvania!5e0!3m2!1sru!2sro!4v1780511747500!5m2!1sru!2sro"
            allowfullscreen
          ></iframe>
        </div>
      </section>

      <footer class="site-footer">
        <p class="footer-initials" data-i18n="footer.initials"></p>
        <p class="footer-follow" data-i18n="footer.follow"></p>
        <p class="footer-see-you" data-i18n="footer.see_you"></p>

        <button
          type="button"
          class="mini-envelope-btn"
          id="back-to-envelope-btn"
          data-i18n-aria="footer.back_to_envelope"
          hidden
        >
          <span class="mini-envelope" aria-hidden="true">
            <span class="mini-envelope__back"></span>
            <span class="mini-envelope__flap"></span>
            <span class="mini-envelope__front"></span>
            <span class="mini-envelope__seal"></span>
          </span>
        </button>
      </footer>
    </main>

    <script type="module" src="js/main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          if (!window.__inviteReady) {
            var hint = document.getElementById("boot-hint");
            if (hint) hint.hidden = false;
          }
        }, 800);
      });
    </script>
  </body>
</html>
